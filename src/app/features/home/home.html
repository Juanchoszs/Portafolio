<section class="relative min-h-[90vh] flex items-center justify-center overflow-hidden w-full perspective-1000">
  
  <!-- Elementos de Ambientación 3D y Glow -->
  <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
    <!-- Orbes animadas mediante CSS (Tailwind extendido) -->
    <div class="absolute top-[10%] left-[20%] w-[500px] h-[500px] bg-blue-600/20 rounded-full blur-[120px] mix-blend-screen animate-pulse duration-[8000ms]"></div>
    <div class="absolute bottom-[10%] right-[10%] w-[600px] h-[600px] bg-indigo-600/10 rounded-full blur-[150px] mix-blend-screen -z-10"></div>
    <div class="absolute top-[40%] right-[30%] w-[300px] h-[300px] bg-purple-500/20 rounded-full blur-[90px] mix-blend-screen"></div>
    
    <!-- Grid sutil de fondo para estructurar el diseño espacial -->
    <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+CjxwYXRoIGQ9Ik0wIDBoNDB2NDBIMHoiIGZpbGw9Im5vbmUiLz4KPGNpcmNsZSBjeD0iMjAiIGN5PSIyMCIgcj0iMSIgZmlsbD0icmdiYSgyNTUsIDI1NSwgMjU1LCAwLjA1KSIvPgo8L3N2Zz4=')] opacity-50"></div>
  </div>

  <div class="max-w-7xl mx-auto px-6 md:px-12 w-full z-10 relative grid grid-cols-1 lg:grid-cols-2 gap-16 lg:gap-8 items-center" *ngIf="isLoaded">
    
    <!-- Lado Izquierdo: Textos y CTAs (Staggered Animations) -->
    <div @revealLayout class="flex flex-col items-start pt-10 lg:pt-0">
      
      <div class="reveal-item mb-6 inline-flex items-center gap-3 px-4 py-2 rounded-full border border-white/10 bg-white/5 backdrop-blur-xl shadow-lg shadow-black/50">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
        </span>
        <span class="text-xs font-bold tracking-widest text-emerald-400 uppercase">Disponible para trabajar</span>
      </div>

      <h1 class="reveal-item text-6xl md:text-8xl font-black tracking-tighter mb-6 leading-[1.05]">
        <span class="block text-white drop-shadow-2xl">Juan Sebastian</span>
        <span class="block text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-400">Rincon Linares</span>
      </h1>

      <div class="reveal-item w-20 h-1.5 bg-gradient-to-r from-blue-500 to-purple-500 rounded-full mb-8"></div>

      <p class="reveal-item text-xl md:text-2xl text-gray-400 mb-10 max-w-xl font-light leading-relaxed">
        <strong>Full Stack Developer.</strong> Especializado en construir arquitecturas escalables, interfaces inmersivas y experiencias web de categoría Elite.
      </p>

      <div class="reveal-item flex flex-col sm:flex-row items-center gap-5 w-full sm:w-auto">
        <a routerLink="/contact"
           class="group relative overflow-hidden w-full sm:w-auto px-8 py-4 bg-white text-black font-bold text-sm tracking-widest uppercase rounded-full transition-all hover:scale-105 active:scale-95 shadow-[0_0_40px_rgba(255,255,255,0.15)]">
          <span class="relative z-10">Contactar Ahora</span>
          <div class="absolute inset-0 h-full w-0 bg-gray-300 transition-[width] duration-300 group-hover:w-full z-0"></div>
        </a>
        
        <a href="Juan Sebastian Rincon Linares CV (1).pdf" download="Juan_Sebastian_Rincon_CV.pdf"
           class="group w-full sm:w-auto px-8 py-4 bg-transparent border border-white/20 text-white font-bold text-sm tracking-widest uppercase rounded-full hover:bg-white/10 hover:border-white/50 transition-all hover:scale-105 active:scale-95 flex items-center justify-center gap-3">
          Descargar CV
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 group-hover:translate-y-1 transition-transform">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
          </svg>
        </a>
      </div>
    </div>

    <!-- Lado Derecho: Imagen y Elementos 3D Float -->
    <div class="relative w-full aspect-square md:aspect-auto md:h-[600px] flex items-center justify-center" @floatingAvatar>
      
      <!-- Contenedor de la Imagen Flotante del MVP -->
      <div class="relative w-72 h-72 md:w-[450px] md:h-[450px] group perspective-1000">
        
        <!-- Glow Detrás -->
        <div class="absolute inset-0 bg-gradient-to-tr from-blue-600 to-purple-600 rounded-full blur-[80px] opacity-40 group-hover:opacity-70 group-hover:rotate-12 transition-all duration-1000"></div>
        
        <!-- Contenedor Principal Perfil -->
        <div class="absolute inset-0 rounded-[2rem] md:rounded-[3rem] border-2 border-white/10 bg-[#0a0a0a] overflow-hidden shadow-2xl transition-transform duration-[1s] group-hover:scale-105 group-hover:-rotate-2 rotate-2">
          
          <img src="images/Perfil.jpeg" alt="Juan Rincon Perfil" 
               class="w-full h-full object-cover opacity-90 mix-blend-luminosity hover:mix-blend-normal transition-all duration-700 scale-110 group-hover:scale-100" />
               
          <!-- Gradiente decorativo sobre la imagen -->
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent pointer-events-none"></div>
        </div>

        <!-- Tarjetas flotantes estilo dashboard -->
        <div class="absolute -bottom-10 -left-10 md:bottom-10 md:-left-16 bg-white/5 backdrop-blur-xl border border-white/20 p-4 rounded-2xl shadow-2xl transition-transform duration-700 hover:scale-110 -rotate-6 group-hover:rotate-0">
          <div class="flex items-center gap-4">
            <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center text-white">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75L22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3l-4.5 16.5" /></svg>
            </div>
            <div>
              <p class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Desarrollador</p>
              <p class="text-white font-bold leading-tight">Angular & React</p>
            </div>
          </div>
        </div>

        <div class="absolute -top-6 -right-6 md:top-20 md:-right-10 bg-white/5 backdrop-blur-xl border border-white/20 p-4 rounded-2xl shadow-2xl transition-transform duration-700 hover:scale-110 rotate-12 group-hover:rotate-0">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-emerald-500 flex items-center justify-center text-white">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>
            </div>
            <div>
              <p class="text-white font-bold whitespace-nowrap">Código Limpio</p>
            </div>
          </div>
        </div>

      </div>
    </div>

  </div>
</section>
