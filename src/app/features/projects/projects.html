<section class="max-w-7xl mx-auto px-6 md:px-12 py-24 z-10 relative">
  
  <!-- Header -->
  <div class="mb-20 flex flex-col md:flex-row md:items-end justify-between gap-6" appScrollReveal>
    <div>
      <h2 class="text-xs font-medium text-blue-400 tracking-[0.2em] uppercase mb-4 flex items-center gap-3">
        <span class="w-12 h-[1px] bg-blue-400/50"></span>
        Portafolio
      </h2>
      <h3 class="text-5xl md:text-7xl font-extrabold tracking-tight text-white mb-6">
        Estudios de <br />
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-500">
          Caso & Proyectos
        </span>
      </h3>
    </div>
    <p class="text-gray-400 max-w-sm text-lg leading-relaxed mb-3">
      Arquitectura escalable, interfaces inmersivas y código limpio aplicado a problemas reales.
    </p>
  </div>

  <!-- Grid de Proyectos Premium -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-10">
    
    <a *ngFor="let project of projects; let i = index" 
         [routerLink]="['/projects', project.id]"
         class="block group relative rounded-[2rem] overflow-hidden bg-[#050505] border border-white/5 shadow-2xl transition-all duration-700 hover:-translate-y-3 hover:shadow-blue-500/10 flex flex-col h-[600px] cursor-pointer"
         appScrollReveal [delay]="(i * 100) + 'ms'">
      
      <!-- Contenedor Imagen (Top Half) -->
      <div class="relative w-full h-[55%] overflow-hidden bg-black/50">
        <!-- Overlay oscuro hacia el contenido -->
        <div class="absolute inset-0 z-10 bg-gradient-to-t from-[#050505] via-[#050505]/40 to-transparent pointer-events-none"></div>
        
        <!-- Imagen del Proyecto con efecto scale -->
        <img [src]="project.image" [alt]="project.title" 
             class="absolute inset-0 w-full h-full object-cover object-top transition-transform duration-[1.5s] ease-out group-hover:scale-110 opacity-70 group-hover:opacity-100" />
        
        <!-- Badges Flotantes -->
        <div class="absolute top-6 left-6 right-6 z-20 flex justify-between items-start pointer-events-none">
          <div *ngIf="project.isPrivate" class="px-4 py-1.5 backdrop-blur-md bg-red-500/10 text-red-400 text-xs font-bold uppercase tracking-widest rounded-full border border-red-500/20 shadow-xl">
            Privado
          </div>
          <div *ngIf="!project.isPrivate && project.link" class="px-4 py-1.5 backdrop-blur-md bg-emerald-500/10 text-emerald-400 text-xs font-bold uppercase tracking-widest rounded-full border border-emerald-500/20 shadow-xl">
            Público
          </div>
        </div>
      </div>

      <!-- Contenido (Bottom Half) -->
      <div class="relative z-20 p-8 flex flex-col flex-grow bg-[#050505] mt-[-2rem] pointer-events-none">
        
        <h4 class="text-sm font-semibold tracking-widest text-blue-400 mb-2 uppercase">{{ project.role }}</h4>
        <h3 class="text-3xl font-black text-white mb-4 tracking-tight">{{ project.title }}</h3>
        
        <p class="text-gray-400 text-base mb-8 line-clamp-3 leading-relaxed">
          {{ project.description }}
        </p>

        <!-- Tags -->
        <div class="flex flex-wrap gap-2 mt-auto mb-8">
          <span *ngFor="let tag of project.tags" class="text-xs font-medium text-gray-300 bg-white/5 backdrop-blur-sm px-3 py-1.5 rounded-lg border border-white/10 transition-colors">
            {{ tag }}
          </span>
        </div>

        <!-- Botón Inferior Simulado (Cosmético, ya que toda la carta es clickeable) -->
        <div class="pt-6 border-t border-white/5 flex items-center justify-between pointer-events-none">
          <div class="group/btn flex items-center gap-3 text-sm font-bold text-white transition-colors">
            Ver Animación 3D & Detalles
            <span class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center group-hover:bg-blue-500 group-hover:scale-110 transition-all shadow-[0_0_15px_rgba(59,130,246,0)] group-hover:shadow-[0_0_15px_rgba(59,130,246,0.5)]">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
              </svg>
            </span>
          </div>
        </div>

      </div>
    
    </a>

  </div>

</section>
