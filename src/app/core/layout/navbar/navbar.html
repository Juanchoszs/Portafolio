<header 
  class="fixed top-0 left-0 w-full z-50 transition-all duration-300 border-b"
  [ngClass]="{
    'bg-transparent border-transparent py-6': !isScrolled,
    'bg-black/60 backdrop-blur-md border-white/10 py-4 shadow-lg': isScrolled
  }">
  <div class="max-w-7xl mx-auto px-6 md:px-12 flex justify-between items-center">
    <!-- Logo -->
    <a routerLink="/" class="text-xl font-bold tracking-tighter text-white hover:text-gray-300 transition-colors">
      JuanRincon<span class="text-blue-500">.</span>
    </a>

    <!-- Desktop Nav -->
    <nav class="hidden md:flex items-center space-x-8">
      <a routerLink="/" class="text-sm font-medium text-gray-300 hover:text-white transition-colors uppercase tracking-widest">Inicio</a>
      <a routerLink="/about" class="text-sm font-medium text-gray-300 hover:text-white transition-colors uppercase tracking-widest">Sobre Mí</a>
      <a routerLink="/projects" class="text-sm font-medium text-gray-300 hover:text-white transition-colors uppercase tracking-widest">Proyectos</a>
    </nav>

    <!-- CTA Contact -->
    <div class="hidden md:flex">
      <a routerLink="/contact" class="px-5 py-2.5 bg-white text-black text-sm font-medium rounded-full hover:bg-gray-200 transition-all duration-300 hover:scale-105 active:scale-95 shadow-[0_0_15px_rgba(255,255,255,0.2)]">
        Contactar
      </a>
    </div>

    <!-- Mobile Menu Toggle (Simplified for base layout) -->
    <button class="md:hidden text-white p-2">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>
  </div>
</header>
